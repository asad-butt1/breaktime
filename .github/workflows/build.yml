name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build installable app (APK)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BreakTime-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # Builds the signed .aab for Google Play. Needs the BT_* secrets (see README).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build signed release bundle (.aab)
        env:
          BT_KEYSTORE_BASE64: ${{ secrets.BT_KEYSTORE_BASE64 }}
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
          BT_KEY_ALIAS: ${{ secrets.BT_KEY_ALIAS }}
          BT_KEY_PASSWORD: ${{ secrets.BT_KEY_PASSWORD }}
        run: |
          if [ -z "$BT_KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set yet, so no Play Store bundle was built. See README > Publishing."
            exit 0
          fi
          # Strip any spaces/line breaks that sneak in when pasting the secrets.
          export BT_KEYSTORE_PASSWORD=$(printf '%s' "$BT_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          export BT_KEY_PASSWORD=$(printf '%s' "$BT_KEY_PASSWORD" | tr -d ' \r\n\t')
          export BT_KEY_ALIAS=$(printf '%s' "$BT_KEY_ALIAS" | tr -d ' \r\n\t')
          printf '%s' "$BT_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" \
            || { echo "::error::BT_KEYSTORE_BASE64 isn't valid. Paste the whole contents of breaktime-upload.jks.base64.txt again."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$BT_KEYSTORE_PASSWORD" \
            || { echo "::error::The keystore or BT_KEYSTORE_PASSWORD is wrong."; exit 1; }
          export BT_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon

      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: BreakTime-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  screenshots:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Render every screen
        run: ./gradlew :app:recordPaparazziDebug -PscreenshotSdk=35 --no-daemon

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: app/src/test/snapshots/images/

      # Also keep the latest screenshots on a "screenshots" branch so they're easy to browse on GitHub.
      - name: Publish screenshots to branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/shots/store && cp app/src/test/snapshots/images/*.png /tmp/shots/
          cp app/build/store-shots/*.png /tmp/shots/store/ || true
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
